{% extends 'base.html' %}
{% block content %}
<div class="card form-container">
    <h2>Multi-User Profiles & Configuration</h2>
    <p style="margin-bottom:20px;">Switch profiles or create a new one to manage different budgets.</p>
    
    <form method="POST">
        <div class="form-group">
            <label>Select Profile / Create New</label>
            <input type="text" list="profiles" name="profile_name" value="{{ current }}" required>
            <datalist id="profiles">
                {% for p in profiles %}
                <option value="{{ p }}">
                {% endfor %}
            </datalist>
        </div>
        <div class="form-group">
            <label>Currency</label>
            <select name="currency" required>
                <option value="PKR">PKR</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Save Profile Settings</button>
    </form>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ddd;">

    <h3 style="color: var(--danger); margin-bottom: 15px;">Danger Zone</h3>
    <form method="POST" onsubmit="return confirm('Are you sure you want to delete ALL transactions, budgets, and goals for the current profile? This cannot be undone.');">
        <input type="hidden" name="action" value="clear_data">
        <button type="submit" class="btn btn-primary" style="background-color: var(--danger); color: white;">Clear All Data for Current Profile</button>
    </form>
</div>
{% endblock %}
